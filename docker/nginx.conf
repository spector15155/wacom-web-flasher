server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES modules need a JavaScript MIME type; packages are binary downloads
    types {
        text/html                html;
        text/css                 css;
        text/javascript          js mjs;
        application/json         json;
        image/svg+xml            svg;
        image/png                png;
        image/gif                gif;
        image/webp               webp;
        application/octet-stream pkg bin;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # firmware packages + manifest live outside the app root (separate mount)
    location /firmware/ {
        alias /srv/firmware/;
    }

    # WebHID is allowed in top-level documents; say so explicitly and keep the app un-framed
    add_header Permissions-Policy "hid=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Development: always serve fresh files (firmware and code are small)
    add_header Cache-Control "no-store" always;
}
