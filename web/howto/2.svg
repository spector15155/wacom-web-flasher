<rect y="380" width="800" height="70" fill="#0e1116"/>
<text text-anchor="middle" font-size="17" fill="#e8ebf1"><tspan x="400" y="406">The tablet powers the pen by radio; the pen rings back with a signal the wires can</tspan><tspan x="400" y="430">hear.</tspan></text>
