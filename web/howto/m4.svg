<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b35"/><stop offset="1" stop-color="#1a1e25"/></linearGradient>
  <linearGradient id="penbody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6270"/><stop offset=".45" stop-color="#9aa1ad"/><stop offset="1" stop-color="#4a505c"/></linearGradient>
</defs>
<rect width="800" height="450" fill="#14171d"/>
<rect x="40" y="300" width="580" height="62" rx="10" fill="url(#slab)" stroke="#343a46"/><line x1="40" y1="300" x2="620" y2="300" stroke="#4a5160" stroke-width="2"/><text x="48" y="378" font-size="11" fill="#8b95a7" letter-spacing="1">TABLET (CROSS-SECTION) · WIRES</text><circle cx="70" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="106" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="142" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="178" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="214" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="250" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="286" cy="332" r="14" fill="#4f8cff" opacity="0.53" filter="url(#glow)"/><circle cx="286" cy="332" r="6" fill="#4f8cff"/><circle cx="322" cy="332" r="17" fill="#3ecf8e" opacity="0.70" filter="url(#glow)"/><circle cx="322" cy="332" r="6" fill="#3ecf8e"/><circle cx="358" cy="332" r="16" fill="#4f8cff" opacity="0.62" filter="url(#glow)"/><circle cx="358" cy="332" r="6" fill="#4f8cff"/><circle cx="394" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="430" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="466" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="502" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="538" cy="332" r="6" fill="#c07a45" opacity=".7"/><circle cx="574" cy="332" r="6" fill="#c07a45" opacity=".7"/><g transform="translate(330,297) rotate(17)"><path d="M0,0 L-9,-34 L9,-34 Z" fill="#c9ced6"/><rect x="-12" y="-238" width="24" height="206" rx="10" fill="url(#penbody)"/><rect x="-12" y="-238" width="24" height="206" rx="10" fill="none" stroke="#b9c0cb" stroke-width="1"/><rect x="11" y="-128" width="5" height="26" rx="2" fill="#3c424d"/></g><path d="M308,301 A22,22 0 0 0 352,301" stroke="#3ecf8e" stroke-width="2.5" fill="none" opacity="0.69"/><path d="M290,301 A40,40 0 0 0 370,301" stroke="#3ecf8e" stroke-width="2.5" fill="none" opacity="0.43"/><line x1="330" y1="299" x2="286" y2="324" stroke="#4f8cff" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/><line x1="330" y1="299" x2="358" y2="324" stroke="#4f8cff" stroke-width="2" stroke-dasharray="3 4" opacity=".8"/><text x="95" y="170" font-size="12" fill="#8b95a7" text-anchor="start" letter-spacing=".5">stock step 3: only the wire under</text><text x="95" y="186" font-size="12" fill="#8b95a7" text-anchor="start" letter-spacing=".5">the pen listens (to read the data)</text><text x="95" y="226" font-size="12" fill="#4f8cff" text-anchor="start" letter-spacing=".5">two measurements: its neighbours</text><text x="95" y="242" font-size="12" fill="#4f8cff" text-anchor="start" letter-spacing=".5">listen too, during the same pulses</text><text x="655" y="130" font-size="13" fill="#3ecf8e" text-anchor="middle" letter-spacing=".5">data still read</text><text x="655" y="150" font-size="12" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">(pressure, buttons)</text><text x="655" y="200" font-size="13" fill="#4f8cff" text-anchor="middle" letter-spacing=".5">+ a second position</text><text x="655" y="220" font-size="12" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">in every cycle</text><text x="655" y="250" font-size="12" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">(~400 per second</text><text x="655" y="266" font-size="12" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">instead of ~200)</text>
<path d="M753.4,24.0 A20,20 0 0 1 771.4,48.8" stroke="#4f8cff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M770.5,51.5 A20,20 0 0 1 735.4,55.2" stroke="#f2b640" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M734.0,52.8 A20,20 0 0 1 750.6,24.0" stroke="#3ecf8e" stroke-width="6" fill="none" stroke-linecap="round" opacity="1"/><text x="712" y="49" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#8b95a7">STEP 3 · READ DATA + LOCATE</text>
<rect y="380" width="800" height="70" fill="#0e1116"/>
<text text-anchor="middle" font-size="17" fill="#e8ebf1"><tspan x="400" y="406">Two measurements (v3.62, v3.78): while the pen sends its data, the neighbouring wires</tspan><tspan x="400" y="430">listen too, so every cycle gives a second real position.</tspan></text>
</svg>
