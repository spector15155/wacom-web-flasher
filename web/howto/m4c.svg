<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b35"/><stop offset="1" stop-color="#1a1e25"/></linearGradient>
  <linearGradient id="penbody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6270"/><stop offset=".45" stop-color="#9aa1ad"/><stop offset="1" stop-color="#4a505c"/></linearGradient>
</defs>
<rect width="800" height="450" fill="#14171d"/>
<text x="220" y="84" font-size="12" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">the frame Wacom calculates from (one axis)</text><rect x="90" y="259" width="40" height="31" rx="4" fill="#7d8594" opacity="0.55"/><text x="110" y="308" font-size="10" fill="#8b95a7" text-anchor="middle" letter-spacing=".5"></text><rect x="146" y="212" width="40" height="78" rx="4" fill="#3ecf8e" opacity="0.9"/><text x="166" y="308" font-size="10" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">left</text><rect x="202" y="120" width="40" height="170" rx="4" fill="#7d8594" opacity="0.55"/><text x="222" y="308" font-size="10" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">pen's wire</text><rect x="258" y="168" width="40" height="122" rx="4" fill="#3ecf8e" opacity="0.9"/><text x="278" y="308" font-size="10" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">right</text><rect x="314" y="249" width="40" height="41" rx="4" fill="#7d8594" opacity="0.55"/><text x="334" y="308" font-size="10" fill="#8b95a7" text-anchor="middle" letter-spacing=".5"></text><line x1="80" y1="290" x2="364" y2="290" stroke="#343a46"/><text x="84" y="330" font-size="11" fill="#3ecf8e" text-anchor="start" letter-spacing=".5">green: from the pen-data step (ratio × the S1 reading)</text><text x="84" y="346" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">grey: from the normal locate step (S1)</text><path d="M390,240 L450,240" stroke="#e8ebf1" stroke-width="2"/><path d="M444,234 L452,240 L444,246" stroke="#e8ebf1" stroke-width="2" fill="none"/><rect x="458" y="208" width="130" height="64" rx="10" fill="#1b2029" stroke="#343a46"/><text x="523" y="236" font-size="12" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">Wacom's position</text><text x="523" y="252" font-size="12" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">calculation</text><path d="M588,240 L630,240" stroke="#e8ebf1" stroke-width="2"/><path d="M624,234 L632,240 L624,246" stroke="#e8ebf1" stroke-width="2" fill="none"/><circle cx="668" cy="240" r="14" fill="none" stroke="#3ecf8e" stroke-width="3"/><text x="668" y="276" font-size="12" fill="#3ecf8e" text-anchor="middle" letter-spacing=".5">2nd position</text><text x="668" y="292" font-size="11" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">of this cycle</text><text x="458" y="96" font-size="12" fill="#e8ebf1" text-anchor="start" letter-spacing=".5">used only if:</text><circle cx="466" cy="110" r="3" fill="#3ecf8e"/><text x="476" y="114" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">the signal is strong (not in high hover)</text><circle cx="466" cy="127" r="3" fill="#3ecf8e"/><text x="476" y="131" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">same wire as S1 (strength within ±10 %)</text><circle cx="466" cy="144" r="3" fill="#3ecf8e"/><text x="476" y="148" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">both X and Y are good</text><circle cx="466" cy="161" r="3" fill="#3ecf8e"/><text x="476" y="165" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">not at the top / left edge</text><text x="458" y="318" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">otherwise the frame keeps the S1 values</text><text x="458" y="334" font-size="11" fill="#8b95a7" text-anchor="start" letter-spacing=".5">(no second position this cycle)</text>
<path d="M753.4,24.0 A20,20 0 0 1 771.4,48.8" stroke="#4f8cff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M770.5,51.5 A20,20 0 0 1 735.4,55.2" stroke="#f2b640" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M734.0,52.8 A20,20 0 0 1 750.6,24.0" stroke="#3ecf8e" stroke-width="6" fill="none" stroke-linecap="round" opacity="1"/><text x="712" y="49" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#8b95a7">STEP 3 · READ DATA + LOCATE</text>
<rect y="380" width="800" height="70" fill="#0e1116"/>
<text text-anchor="middle" font-size="17" fill="#e8ebf1"><tspan x="400" y="406">The ratios replace the neighbour values in Wacom's frame, and Wacom's own calculation</tspan><tspan x="400" y="430">turns them into the cycle's second position.</tspan></text>
</svg>
