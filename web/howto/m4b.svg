<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262b35"/><stop offset="1" stop-color="#1a1e25"/></linearGradient>
  <linearGradient id="penbody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6270"/><stop offset=".45" stop-color="#9aa1ad"/><stop offset="1" stop-color="#4a505c"/></linearGradient>
</defs>
<rect width="800" height="450" fill="#14171d"/>
<text x="200" y="88" font-size="14" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">strong burst</text><rect x="120" y="110" width="60" height="160" rx="5" fill="#3ecf8e" opacity=".85"/><rect x="220" y="203" width="60" height="67" rx="5" fill="#4f8cff" opacity=".85"/><line x1="100" y1="270" x2="300" y2="270" stroke="#343a46"/><text x="150" y="286" font-size="11" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">Y: pen's wire</text><text x="250" y="286" font-size="11" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">X: neighbour</text><text x="150" y="102.0" font-size="13" fill="#3ecf8e" text-anchor="middle" letter-spacing=".5">1.00</text><text x="250" y="194.8" font-size="13" fill="#4f8cff" text-anchor="middle" letter-spacing=".5">0.42</text><text x="200" y="316" font-size="15" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">0.42 ÷ 1.00 = 0.42</text><text x="530" y="88" font-size="14" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">weaker burst (pen losing charge)</text><rect x="450" y="158" width="60" height="112" rx="5" fill="#3ecf8e" opacity=".85"/><rect x="550" y="223" width="60" height="47" rx="5" fill="#4f8cff" opacity=".85"/><line x1="430" y1="270" x2="630" y2="270" stroke="#343a46"/><text x="480" y="286" font-size="11" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">Y: pen's wire</text><text x="580" y="286" font-size="11" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">X: neighbour</text><text x="480" y="150.0" font-size="13" fill="#3ecf8e" text-anchor="middle" letter-spacing=".5">0.70</text><text x="580" y="214.96" font-size="13" fill="#4f8cff" text-anchor="middle" letter-spacing=".5">0.29</text><text x="530" y="316" font-size="15" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">0.29 ÷ 0.70 = 0.42</text><text x="400" y="324" font-size="28" fill="#8b95a7" text-anchor="middle" letter-spacing=".5">=</text><text x="400" y="356" font-size="13" fill="#e8ebf1" text-anchor="middle" letter-spacing=".5">the same ratio: it only depends on where the pen is</text>
<path d="M753.4,24.0 A20,20 0 0 1 771.4,48.8" stroke="#4f8cff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M770.5,51.5 A20,20 0 0 1 735.4,55.2" stroke="#f2b640" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.18"/><path d="M734.0,52.8 A20,20 0 0 1 750.6,24.0" stroke="#3ecf8e" stroke-width="6" fill="none" stroke-linecap="round" opacity="1"/><text x="712" y="49" text-anchor="end" font-size="11" letter-spacing="1.5" fill="#8b95a7">STEP 3 · READ DATA + LOCATE</text>
<rect y="380" width="800" height="70" fill="#0e1116"/>
<text text-anchor="middle" font-size="17" fill="#e8ebf1"><tspan x="400" y="406">Why divide: the pen's signal changes from burst to burst. Dividing a neighbour reading</tspan><tspan x="400" y="430">by the other axis's reading of the same burst cancels that out.</tspan></text>
</svg>
